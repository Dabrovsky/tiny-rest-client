AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Lint/MissingSuper:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "test/**/*"

Metrics/MethodLength:
  Max: 20

Metrics/ParameterLists:
  Max: 8

Metrics/AbcSize:
  Max: 20
  Exclude:
    - "test/**/*"

Naming/FileName:
  Exclude:
    - "lib/tiny-rest-client.rb"
